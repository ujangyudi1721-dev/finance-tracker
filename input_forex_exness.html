<!doctype html>
<html lang="en">
      <head>
            <meta charset="UTF-8" />
            <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1.0"
            />
            <title>Jurnal</title>
            <link rel="stylesheet" href="style.css" />
      </head>
      <body>
            <nav>
                  <a href="index.html">dashboard</a>
                  <a href="input_forex.html">Input CSV</a>
            </nav>

            <h1>Input Forex</h1>
            <form id="inputForex">
                  <select name="" id="pair">
                        
                        <option value="xau">XAU-USD</option>
                        <option value="jpy">USD-JPY</option>
                        <option value="eur">EUR-USD</option>
                        <option value="gj">GBP-JPY</option>
                        <option value="btc">BTC-USD</option>
                        <option value="deposit">Deposit</option>
                        <option value="withdraw">Withdraw</option>
                  </select>

                  <select name="" id="tipe_open">
                        <option value="buy">Buy</option>
                        <option value="sell">Sell</option>
                        <option value="deposit">Deposit</option>
                        <option value="withdraw">Withdraw</option>
                  </select>

                  <input type="date" id="created_at" placeholder="Tanggal" />
 
                  <input type="text" name="" id="lot" placeholder="Lot"/>

                  <input type="text" id="aktual" placeholder="Aktual" />

                  <select name="" id="exit">
                        <option value="SL">Stop loss</option>
                        <option value="TP">Take Profit</option>
                        <option value="CL">Cut Loss</option>
                        <option value="CP">Cut Profit</option>
                  </select>

                  <input type="text" id="keterangan" placeholder="Keterangan">
                  <button type="submit">Simpan</button>
                  
                  <p>
                        Total Saldo = USC <span id="statSaldo"></span>
                        &nbsp;&nbsp;&nbsp;
                        Target loss = <span id="statLoss"></span>
                        &nbsp;&nbsp;&nbsp;
                        Target profit = <span id="statProfit"></span>
                  </p>

            </form>
            
            <h1>Riwayat Transaksi</h1>
            <table border="1" width="100%">
                  <thead>
                        <tr>
                              <th>Tanggal</th>
                              <th>pair</th>
                              <th>Tipe open</th>
                              <th>Lot</th>
                              <th>Target Loss</th>
                              <th>Target profit</th>
                              <th>Aktual</th>
                              <th>Exit</th>
                              <th>Saldo</th>
                              <th>Keterangan</th>
                        </tr>
                  </thead>

                  <tbody id="riwayatTableForex"></tbody>
            </table>

            <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
            <script type="module" src="js/pages/forexInput.js"></script>
            <script type="module" src="js/pages/riwayat_forex.js"></script>
      </body>
</html>
