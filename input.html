<!doctype html>
<html lang="en">
      <head>
            <meta charset="UTF-8" />
            <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1.0"
            />
            <title>Input Transaksi</title>
            <link rel="stylesheet" href="style.css" />
      </head>
      <body>
            <nav>
                  <a href="index.html">Dashboard</a>
                  <a href="riwayat.html">Riwayat Transaksi</a>
            </nav>

            <h2>Input Transaksi</h2>

            <form id="formKeuangan">
                  <input type="date" id="tanggal" placeholder="Tanggal" />
                  <select id="tipe">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                        <option value="transfer">Transfer</option>
                  </select>
                  <input type="text" id="kategori" placeholder="Kategori" />
                  <input type="number" id="jumlah" placeholder="Jumlah" />
                  <input type="text" id="keterangan" placeholder="Keterangan" />

                  <select id="akun">
                        <option value="cash">Cash</option>
                        <option value="cimb">CIMB</option>
                        <option value="sea">Sea Bank</option>
                        <option value="neo">Neo Bank</option>
                        <option value="bri">Bank BRI</option>
                  </select>

                  <div id="transferField" style="display: none">
                        <label>Transfer Ke</label>
                        <select id="tujuanAkun">
                              <option value="cash">Cash</option>
                              <option value="cimb">CIMB</option>
                              <option value="sea">Sea Bank</option>
                              <option value="neo">Neo Bank</option>
                              <option value="bri">Bank BRI</option>
                        </select>
                  </div>

                  <button type="submit" id="btnUpdate">Update</button>
                  <button id="btnSimpan">Simpan</button>
            </form>

             <h1>Riwayat Transaksi</h1>

            <!-- tampilan kolom search-->
            <div style="margin-bottom: 20px; display: flex; gap: 10px">
                  <input
                        type="text"
                        id="searchInput"
                        placeholder="Cari keterangan"
                  />

                  <select id="filterAkun">
                        <option value="all">Semua</option>
                        <option value="cash">Cash</option>
                        <option value="cimb">CIMB Niaga</option>
                        <option value="sea">SEA Bank</option>
                        <option value="neo">Neo Bank</option>
                        <option value="bri">Bank BRI</option>
                  </select>

                  <select id="filterType">
                        <option value="all">Semua</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                        <option value="transfer">Transfer</option>
                  </select>

                  <select id="filterDate">
                        <option value="all">Semua Tanggal</option>
                        <option value="today">Hari Ini</option>
                        <option value="7days">7 Hari terakhir</option>
                        <option value="month">Bulan</option>
                  </select>
            </div>

            <!-- tampilan u/ statistik diatas tabel riwayat -->
            <div style="display: flex; gap: 20px; margin-bottom: 20px">
                  <div>
                        <strong>Total Income</strong><br />
                        <span id="statIncome">0</span>
                  </div>

                  <div>
                        <strong>Total Expense</strong><br />
                        <span id="statExpense">0</span>
                  </div>

                  <div>
                        <strong>Net Balance</strong><br />
                        <span id="statBalance">0</span>
                  </div>
            </div>

            <!-- tampilan tabel riwayat -->
            <table border="1" width="100%">
                  <thead>
                        <tr>
                              <th>Tanggal</th>
                              <th>Tipe</th>
                              <th>Akun</th>
                              <th>Jumlah</th>
                              <th>Keterangan</th>
                              <th>Aksi</th>
                        </tr>
                  </thead>

                  <tbody id="riwayatTable"></tbody>
            </table>

            <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
            <script type="module" src="js/pages/input.js"></script>
            <script type="module" src="js/riwayat.js"></script>
      </body>
</html>
